services:
  factorio-controller:
    build:
      context: .
      dockerfile: FactorioServerController/Dockerfile
    container_name: factorio-server-controller
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Pass the host mount path down so the controller can spin up the Factorio servers in the right folder on the host!
      - HOST_DATA_PATH=./factorio-data
    volumes:
      # Map the unified Factorio data folder (contains app-data/ and instances/)
      - ./factorio-data:/data
      # Map the Docker socket so the controller can spin up the Factorio containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
